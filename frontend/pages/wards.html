<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediCore HMS — Wards</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    .ward-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .ward-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;transition:all var(--transition);animation:fadeUp 0.3s ease both}
    .ward-card:hover{transform:translateY(-2px);border-color:var(--border-light)}
    .ward-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
    .ward-name{font-size:16px;font-weight:600;margin-bottom:2px}
    .ward-type{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px}
    .occ-bar-bg{background:var(--bg-secondary);border-radius:99px;height:8px;overflow:hidden;margin:14px 0 10px}
    .occ-bar-fill{height:100%;border-radius:99px;transition:width 0.8s ease}
    .ward-nums{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-muted)}
    .ward-nums span{font-weight:600;color:var(--text-primary)}
    .bed-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:14px}
    .bed-cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s}
    .bed-occupied{background:var(--accent-rose-dim);color:var(--accent-rose);border-color:rgba(255,94,126,.2)}
    .bed-free{background:var(--accent-teal-dim);color:var(--accent-teal);border-color:rgba(0,212,170,.2)}
  </style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo"><div class="logo-icon">✦</div><span class="logo-text">MediCore</span></div>
  <nav class="sidebar-nav">
    <a href="../index.html" class="nav-item"><span class="nav-icon">⬡</span> Dashboard</a>
    <a href="patients.html" class="nav-item"><span class="nav-icon">◎</span> Patients</a>
    <a href="doctors.html" class="nav-item"><span class="nav-icon">◈</span> Doctors</a>
    <a href="appointments.html" class="nav-item"><span class="nav-icon">◷</span> Appointments</a>
    <a href="billing.html" class="nav-item"><span class="nav-icon">◆</span> Billing</a>
    <a href="pharmacy.html" class="nav-item"><span class="nav-icon">◉</span> Pharmacy</a>
    <a href="wards.html" class="nav-item active"><span class="nav-icon">▣</span> Wards</a>
    <a href="reports.html" class="nav-item"><span class="nav-icon">◧</span> Reports</a>
  </nav>
  <div class="sidebar-user">
    <div class="user-avatar">AD</div>
    <div class="user-info"><div class="user-name">Dr. Admin</div><div class="user-role">Super Admin</div></div>
  </div>

  <button class="btn btn-secondary btn-sm btn-block" id="logoutBtn" style="margin:10px 20px 4px;width:calc(100% - 40px)">🚪 Log out</button>
</aside>

<main class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="breadcrumb">Wards <span>/ Bed Management</span></div>
    </div>
    <div class="topbar-right"><div class="date-display" id="dateDisplay"></div></div>
  </header>

  <div class="page-container">
    <h1 class="page-title">Ward & Bed Management</h1>
    <p class="page-subtitle">Real-time overview of all wards and bed occupancy</p>

    <!-- Summary -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px">
      <div class="card" style="padding:16px"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Total Beds</div><div style="font-family:var(--font-display);font-size:24px" id="totalBeds">—</div></div>
      <div class="card" style="padding:16px"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Occupied</div><div style="font-family:var(--font-display);font-size:24px;color:var(--accent-rose)" id="occupiedBeds">—</div></div>
      <div class="card" style="padding:16px"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Available</div><div style="font-family:var(--font-display);font-size:24px;color:var(--accent-teal)" id="availBeds">—</div></div>
      <div class="card" style="padding:16px"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Occupancy Rate</div><div style="font-family:var(--font-display);font-size:24px" id="occRate">—</div></div>
    </div>

    <div class="page-actions" style="margin-bottom:20px">
      <div class="filter-bar">
        <select id="typeFilter" onchange="render()">
          <option value="">All Types</option>
          <option>General</option><option>ICU</option><option>Maternity</option><option>Pediatric</option>
          <option>Specialty</option><option>Private</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="openModal()" data-admin-only>➕ Add Ward</button>
    </div>

    <div class="ward-grid" id="wardGrid"></div>
  </div>
</main>

<!-- Add/Edit Ward Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Add Ward</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Ward Name *</label><input class="form-control" id="fName" placeholder="Ward name"/><span class="field-error" data-error-for="name"></span></div>
      <div class="form-group"><label>Type</label>
        <select class="form-control" id="fType">
          <option>General</option><option>ICU</option><option>Maternity</option>
          <option>Pediatric</option><option>Specialty</option><option>Private</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Capacity</label><input class="form-control" type="number" id="fCap" placeholder="Total beds"/><span class="field-error" data-error-for="capacity"></span></div>
      <div class="form-group"><label>Currently Occupied</label><input class="form-control" type="number" id="fOcc" placeholder="Occupied beds"/><span class="field-error" data-error-for="occupied"></span></div>
    </div>
    <div class="form-group"><label>Floor</label><input class="form-control" type="number" id="fFloor" placeholder="Floor number"/></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveWard()">Save Ward</button>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/wards.js"></script>
</body>
</html>
