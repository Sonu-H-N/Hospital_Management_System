<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MediCore HMS — Create Account</title>
<link rel="stylesheet" href="css/main.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page">

<main class="auth-card">
  <div class="auth-brand">
    <div class="logo-icon">✦</div>
    <span>MediCore</span>
  </div>

  <h2>Create staff account</h2>
  <p class="sub">Register to access the hospital management system.</p>

  <div id="formError" class="auth-error" role="alert"></div>

  <form id="registerForm" novalidate>
    <div class="form-group">
      <label>Full Name</label>
      <input class="form-control" type="text" id="name" autocomplete="name" required/>
      <span class="field-error" data-error-for="name"></span>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input class="form-control" type="email" id="email" autocomplete="email" required/>
      <span class="field-error" data-error-for="email"></span>
    </div>
    <div class="form-group">
      <label>Staff Role</label>
      <select class="form-control" id="role">
        <option value="Receptionist">Receptionist</option>
        <option value="Doctor">Doctor</option>
        <option value="Pharmacist">Pharmacist</option>
        <option value="Admin">Admin</option>
      </select>
      <span class="field-error" data-error-for="role"></span>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input class="form-control" type="password" id="password" autocomplete="new-password" required/>
      <span style="font-size:11.5px;color:var(--text-muted)">At least 8 characters, including a number.</span>
      <span class="field-error" data-error-for="password"></span>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
  </form>

  <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/register.js"></script>
</body>
</html>
